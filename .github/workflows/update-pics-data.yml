name: Update PICS Depot Mappings

on:
  # Run incremental every hour
  # Run full update every Sunday at 4 AM UTC
  schedule:
    - cron: '0 * * * *'      # Incremental: Every hour
    - cron: '0 4 * * 0'      # Full: Every Sunday at 4 AM UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

# Prevent concurrent runs to avoid merge conflicts
concurrency:
  group: pics-update
  cancel-in-progress: false  # Let current run finish, queue the next one

jobs:
  update-pics-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PicsDataCollector/PicsDataCollector.csproj

      - name: Build project
        run: dotnet build PicsDataCollector/PicsDataCollector.csproj --configuration Release --no-restore

      - name: Determine update mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Check if it's Sunday (day 0) for full update
            if [ "$(date -u +%u)" == "7" ]; then
              echo "mode=full" >> $GITHUB_OUTPUT
              echo "Running scheduled FULL update (weekly Sunday)"
            else
              echo "mode=incremental" >> $GITHUB_OUTPUT
              echo "Running scheduled INCREMENTAL update"
            fi
          else
            # Manual trigger - use selected mode
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "Running manual ${{ github.event.inputs.mode }} update"
          fi

      - name: Run PICS data collector (Incremental)
        if: steps.mode.outputs.mode == 'incremental'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_KEY }}
        run: dotnet run --project PicsDataCollector/PicsDataCollector.csproj --configuration Release -- --incremental
        timeout-minutes: 60

      - name: Run PICS data collector (Full)
        if: steps.mode.outputs.mode == 'full'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_KEY }}
        run: dotnet run --project PicsDataCollector/PicsDataCollector.csproj --configuration Release -- --full
        timeout-minutes: 240

      - name: Check for changes
        id: check_changes
        run: |
          # Compare generated file against latest release to detect changes
          if [ -f output/pics_depot_mappings.json ]; then
            NEW_HASH=$(sha256sum output/pics_depot_mappings.json | cut -d' ' -f1)

            # Try to download the file from the latest release for comparison
            LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              gh release download "$LATEST_TAG" -p "pics_depot_mappings.json" -D /tmp/old_release 2>/dev/null || true
              if [ -f /tmp/old_release/pics_depot_mappings.json ]; then
                OLD_HASH=$(sha256sum /tmp/old_release/pics_depot_mappings.json | cut -d' ' -f1)
                if [ "$NEW_HASH" == "$OLD_HASH" ]; then
                  echo "changed=false" >> $GITHUB_OUTPUT
                  echo "No changes detected compared to latest release"
                else
                  echo "changed=true" >> $GITHUB_OUTPUT
                  echo "Changes detected compared to latest release"
                fi
              else
                echo "changed=true" >> $GITHUB_OUTPUT
                echo "No previous release found to compare - treating as changed"
              fi
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "No releases exist yet - treating as changed"
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Output file not found"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release with data file
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get metadata from JSON file
          TOTAL_MAPPINGS=$(jq -r '.metadata.totalMappings' output/pics_depot_mappings.json)
          LAST_UPDATED=$(jq -r '.metadata.lastUpdated' output/pics_depot_mappings.json)
          LAST_CHANGE=$(jq -r '.metadata.lastChangeNumber' output/pics_depot_mappings.json)

          # Create release tag with timestamp
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          RELEASE_NAME="Steam Data Update - $(date +'%Y-%m-%d')"

          # Create release notes
          cat << EOF > release_notes.md
          ## Steam PICS Data Collection Update

          ### PICS Depot Mappings
          - **Total Mappings:** $TOTAL_MAPPINGS
          - **Last Change Number:** $LAST_CHANGE
          - **Last Updated:** $LAST_UPDATED

          ---

          ## Download

          ### PICS Depot-to-App Mappings
          Complete depot mappings with app information collected via PICS protocol.

          **Direct URL:**
          \`\`\`
          https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/pics_depot_mappings.json
          \`\`\`

          ---

          ## What's Included

          **pics_depot_mappings.json** - Complete depot-to-app mappings via PICS
          - Collected via SteamKit2 PICS protocol
          - Includes app names, types, and header image URLs
          - Tracks depot ownership and app relationships
          - Essential for lancache and content distribution
          - ~230,000+ depot mappings

          ### Data Structure
          Each depot mapping includes:
          - App IDs and names
          - App types (game, dlc, demo, etc.)
          - Header image URLs
          - Depot owner information
          - Discovery metadata

          ## Usage

          \`\`\`bash
          # Download the PICS data file
          curl -LO https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/pics_depot_mappings.json
          \`\`\`
          EOF

          # Create release and upload JSON file
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_notes.md \
            output/pics_depot_mappings.json

          echo "Created release: $RELEASE_TAG"

      - name: Create update summary
        if: always()
        run: |
          echo "## PICS Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f output/pics_depot_mappings.json ]; then
            TOTAL_MAPPINGS=$(jq -r '.metadata.totalMappings' output/pics_depot_mappings.json)
            LAST_UPDATED=$(jq -r '.metadata.lastUpdated' output/pics_depot_mappings.json)
            LAST_CHANGE=$(jq -r '.metadata.lastChangeNumber' output/pics_depot_mappings.json)

            echo "- **Total Mappings**: $TOTAL_MAPPINGS" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Updated**: $LAST_UPDATED" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Change Number**: $LAST_CHANGE" >> $GITHUB_STEP_SUMMARY
            echo "- **Changes Committed**: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ PICS data file not found" >> $GITHUB_STEP_SUMMARY
          fi
