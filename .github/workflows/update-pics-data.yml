name: Update PICS Depot Mappings

on:
  # Run incremental every 4 hours
  # Run full update every Sunday at 4 AM UTC
  schedule:
    - cron: '0 */4 * * *'    # Incremental: Every 4 hours
    - cron: '0 4 * * 0'      # Full: Every Sunday at 4 AM UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

jobs:
  update-pics-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PicsDataCollector/PicsDataCollector.csproj

      - name: Build project
        run: dotnet build PicsDataCollector/PicsDataCollector.csproj --configuration Release --no-restore

      - name: Determine update mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Check if it's Sunday (day 0) for full update
            if [ "$(date -u +%u)" == "7" ]; then
              echo "mode=full" >> $GITHUB_OUTPUT
              echo "Running scheduled FULL update (weekly Sunday)"
            else
              echo "mode=incremental" >> $GITHUB_OUTPUT
              echo "Running scheduled INCREMENTAL update"
            fi
          else
            # Manual trigger - use selected mode
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "Running manual ${{ github.event.inputs.mode }} update"
          fi

      - name: Run PICS data collector (Incremental)
        if: steps.mode.outputs.mode == 'incremental'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_KEY }}
        run: dotnet run --project PicsDataCollector/PicsDataCollector.csproj --configuration Release -- --incremental
        timeout-minutes: 60

      - name: Run PICS data collector (Full)
        if: steps.mode.outputs.mode == 'full'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_KEY }}
        run: dotnet run --project PicsDataCollector/PicsDataCollector.csproj --configuration Release -- --full
        timeout-minutes: 120

      - name: Check for changes
        id: check_changes
        run: |
          # Add both JSON files to staging to check if new or modified
          git add output/pics_depot_mappings.json output/steam_apps.json

          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in output files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in output files"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # File already staged in previous step
          # Get metadata from JSON for commit message
          TOTAL_MAPPINGS=$(jq -r '.metadata.totalMappings' output/pics_depot_mappings.json)
          LAST_UPDATED=$(jq -r '.metadata.lastUpdated' output/pics_depot_mappings.json)

          git commit -m "Update PICS depot mappings - $TOTAL_MAPPINGS mappings" \
                     -m "Last updated: $LAST_UPDATED" \
                     -m "" \
                     -m "Automated update via GitHub Actions"

          git push

      - name: Create release with data file
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get metadata from JSON files
          TOTAL_MAPPINGS=$(jq -r '.metadata.totalMappings' output/pics_depot_mappings.json)
          LAST_UPDATED=$(jq -r '.metadata.lastUpdated' output/pics_depot_mappings.json)
          LAST_CHANGE=$(jq -r '.metadata.lastChangeNumber' output/pics_depot_mappings.json)
          TOTAL_APPS=$(jq -r '.metadata.totalApps // "N/A"' output/steam_apps.json)

          # Create release tag with timestamp
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          RELEASE_NAME="Steam Data Update - $(date +'%Y-%m-%d')"

          # Create release notes
          cat << EOF > release_notes.md
          ## Steam Data Collection Update

          ### Depot Mappings
          - **Total Mappings:** $TOTAL_MAPPINGS
          - **Last Change Number:** $LAST_CHANGE

          ### Steam Apps
          - **Total Apps:** $TOTAL_APPS apps
          - **Types:** games, DLC, software, videos, hardware

          ### Last Updated
          $LAST_UPDATED

          ---

          ## Download

          ### Complete Steam App List
          All Steam applications with names and types.

          **Direct URL:**
          \`\`\`
          https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/steam_apps.json
          \`\`\`

          ### Depot-to-App Mappings
          Detailed depot ownership and relationships via PICS.

          **Direct URL:**
          \`\`\`
          https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/pics_depot_mappings.json
          \`\`\`

          ---

          ## What's Included

          **steam_apps.json** - Complete Steam application database
          - Fetched via IStoreService/GetAppList/v1
          - Includes all games, DLC, software, videos, and hardware
          - ~205,000+ applications

          **pics_depot_mappings.json** - Depot-to-app mappings
          - Collected via SteamKit2 PICS protocol
          - Tracks depot ownership and app relationships
          - Essential for lancache and content distribution

          ## Usage

          \`\`\`bash
          # Download both files
          curl -LO https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/steam_apps.json
          curl -LO https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/pics_depot_mappings.json
          \`\`\`
          EOF

          # Create release and upload both JSON files
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_notes.md \
            output/pics_depot_mappings.json \
            output/steam_apps.json

          echo "Created release: $RELEASE_TAG"

      - name: Create update summary
        if: always()
        run: |
          echo "## PICS Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f output/pics_depot_mappings.json ]; then
            TOTAL_MAPPINGS=$(jq -r '.metadata.totalMappings' output/pics_depot_mappings.json)
            LAST_UPDATED=$(jq -r '.metadata.lastUpdated' output/pics_depot_mappings.json)
            LAST_CHANGE=$(jq -r '.metadata.lastChangeNumber' output/pics_depot_mappings.json)

            echo "- **Total Mappings**: $TOTAL_MAPPINGS" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Updated**: $LAST_UPDATED" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Change Number**: $LAST_CHANGE" >> $GITHUB_STEP_SUMMARY
            echo "- **Changes Committed**: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ PICS data file not found" >> $GITHUB_STEP_SUMMARY
          fi
